<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova AI // Next-Gen Voice Agent</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --bg: #030305;

            --surface: rgba(18, 18, 26, 0.70);

            --border: rgba(255, 255, 255, 0.12);

            --text-main: #ffffff;
            --text-muted: #9ca3af;

            --primary: #7c3aed;
            --primary-light: #a78bfa;

            --success: #22c55e;
            --danger: #ef4444;

            --shadow:
                0 25px 50px rgba(0, 0, 0, 0.55);
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1rem;

            background: var(--bg);

            color: var(--text-main);

            font-family:
                "Plus Jakarta Sans",
                sans-serif;

            overflow: hidden;
        }


        /* =========================================================
           CAMERA BACKGROUND
        ========================================================= */

        #cameraBackground {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -3;

            transform: scaleX(-1);

            background: #030305;
        }


        /* =========================================================
           CAMERA DARK OVERLAY
        ========================================================= */

        .camera-overlay {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: -2;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.48) 0%,
                    rgba(0, 0, 0, 0.18) 40%,
                    rgba(0, 0, 0, 0.60) 100%
                );

            backdrop-filter: blur(3px);

            -webkit-backdrop-filter: blur(3px);
        }


        /* =========================================================
           CAMERA GLOW
        ========================================================= */

        .camera-glow {

            position: fixed;

            inset: 0;

            z-index: -1;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    rgba(124, 58, 237, 0.12),
                    transparent 55%
                );
        }


        /* =========================================================
           MAIN CARD
        ========================================================= */

        .container {

            width: 100%;

            max-width: 520px;

            padding: 1.8rem 2.5rem;

            background: var(--surface);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            border:
                1px solid
                var(--border);

            border-radius: 28px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);

            position: relative;

            z-index: 10;

            opacity: 0;

            transform:
                translateY(30px)
                scale(1);

            animation:
                containerEntrance
                1.2s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;
        }


        /* =========================================================
           CARD ENTRANCE
        ========================================================= */

        @keyframes containerEntrance {

            0% {

                opacity: 0;

                transform:
                    translateY(60px)
                    scale(0.95);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(30px)
                    scale(1);
            }
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {

            text-align: center;

            margin-bottom: 1.5rem;
        }


        .status-indicator {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 0.65rem;

            padding: 5px 11px;

            border-radius: 50px;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid
                rgba(34, 197, 94, 0.20);

            color: #86efac;

            font-size: 0.68rem;

            font-family:
                "JetBrains Mono",
                monospace;

            letter-spacing: 0.05em;
        }


        .status-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.8);

            animation:
                statusPulse 2s
                infinite;
        }


        @keyframes statusPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }


        .title {

            font-size: 2.1rem;

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -0.05em;

            margin-bottom: 0.5rem;
        }


        .title span {

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a78bfa,
                    #818cf8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;

            background-clip: text;
        }


        .subtitle {

            color: var(--text-muted);

            font-size: 0.8rem;

            line-height: 1.5;
        }


        /* =========================================================
           VISUALIZER
        ========================================================= */

        .visualizer-container {

            width: 160px;

            height: 160px;

            margin:
                0 auto 1.5rem auto;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .ring {

            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(139, 92, 246, 0.35);

            animation:
                rotateRing
                12s
                linear
                infinite;
        }


        .ring-1 {

            width: 100%;
            height: 100%;

            border-top-color:
                rgba(139, 92, 246, 0.9);
        }


        .ring-2 {

            width: 82%;
            height: 82%;

            border-bottom-color:
                rgba(99, 102, 241, 0.9);

            animation-direction:
                reverse;

            animation-duration:
                9s;
        }


        @keyframes rotateRing {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           MIC BUTTON
        ========================================================= */

        .mic-btn {

            width: 95px;

            height: 95px;

            border: none;

            border-radius: 50%;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            z-index: 5;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );

            box-shadow:
                0 15px 35px
                rgba(99, 102, 241, 0.45),

                inset 0 2px 3px
                rgba(255, 255, 255, 0.3);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .mic-btn:hover {

            transform:
                scale(1.06);

            box-shadow:
                0 20px 45px
                rgba(99, 102, 241, 0.6);
        }


        .mic-btn:active {

            transform:
                scale(0.94);
        }


        .mic-icon {

            width: 32px;
            height: 32px;

            fill: white;
        }


        /* =========================================================
           LISTENING STATE
        ========================================================= */

        .mic-btn.listening {

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            box-shadow:
                0 0 0 10px
                rgba(239, 68, 68, 0.10),

                0 0 45px
                rgba(239, 68, 68, 0.55);

            animation:
                listeningPulse
                1.5s
                infinite;
        }


        @keyframes listeningPulse {

            0%,
            100% {

                transform: scale(1);
            }

            50% {

                transform:
                    scale(1.04);
            }
        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status-box {

            text-align: center;

            margin-bottom: 1rem;
        }


        #status {

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.72rem;

            color: #c4b5fd;

            letter-spacing: 0.02em;
        }


        /* =========================================================
           TRANSCRIPT
        ========================================================= */

        .transcript {

            min-height: 45px;

            padding: 0.8rem 1rem;

            border-radius: 12px;

            background:
                rgba(0, 0, 0, 0.25);

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            color: #d1d5db;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 0.68rem;

            line-height: 1.5;

            text-align: center;

            word-break: break-word;

            margin-bottom: 1rem;
        }


        #transcript:empty::before {

            content:
                "Your voice command will appear here...";
            
            color:
                rgba(255, 255, 255, 0.3);
        }


        /* =========================================================
           WAVE
        ========================================================= */

        .wave {

            height: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 3px;

            margin-bottom: 1rem;
        }


        .wave span {

            display: block;

            width: 3px;

            height: 5px;

            border-radius: 5px;

            background:
                rgba(167, 139, 250, 0.5);

            transition:
                height 0.15s ease;
        }


        .wave.active span {

            animation:
                waveAnimation
                0.8s
                ease-in-out
                infinite
                alternate;
        }


        .wave span:nth-child(2) {
            animation-delay: 0.1s;
        }

        .wave span:nth-child(3) {
            animation-delay: 0.2s;
        }

        .wave span:nth-child(4) {
            animation-delay: 0.3s;
        }

        .wave span:nth-child(5) {
            animation-delay: 0.4s;
        }

        .wave span:nth-child(6) {
            animation-delay: 0.5s;
        }

        .wave span:nth-child(7) {
            animation-delay: 0.6s;
        }


        @keyframes waveAnimation {

            from {
                height: 5px;
            }

            to {
                height: 22px;
            }
        }


        /* =========================================================
           COMMANDS
        ========================================================= */

        .commands-title {

            text-align: center;

            color:
                rgba(255, 255, 255, 0.45);

            font-size: 0.62rem;

            text-transform:
                uppercase;

            letter-spacing:
                0.12em;

            margin-bottom:
                0.65rem;
        }


        .commands {

            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .command-chip {

            width: 100%;

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            background:
                rgba(255, 255, 255, 0.035);

            color:
                rgba(255, 255, 255, 0.62);

            padding:
                8px 10px;

            border-radius: 9px;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size:
                0.61rem;

            text-align: center;

            cursor: pointer;

            transition:
                all 0.2s ease;
        }


        .command-chip:hover {

            background:
                rgba(124, 58, 237, 0.15);

            border-color:
                rgba(139, 92, 246, 0.35);

            color:
                white;

            transform:
                translateY(-1px);
        }


        /* =========================================================
           CAMERA ERROR
        ========================================================= */

        .camera-error {

            position: fixed;

            bottom: 12px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                7px 12px;

            border-radius:
                50px;

            background:
                rgba(0, 0, 0, 0.55);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            color:
                rgba(255, 255, 255, 0.45);

            font-family:
                "JetBrains Mono",
                monospace;

            font-size:
                0.55rem;

            opacity: 0;

            pointer-events:
                none;

            transition:
                opacity 0.3s ease;
        }


        .camera-error.show {

            opacity: 1;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            body {

                padding:
                    0.8rem;
            }


            .container {

                max-width:
                    450px;

                padding:
                    1.5rem 1.3rem;

                border-radius:
                    24px;

                transform:
                    translateY(20px);
            }


            @keyframes containerEntrance {

                0% {

                    opacity: 0;

                    transform:
                        translateY(50px)
                        scale(0.95);
                }

                100% {

                    opacity: 1;

                    transform:
                        translateY(20px)
                        scale(1);
                }
            }


            .header {

                margin-bottom:
                    1.1rem;
            }


            .title {

                font-size:
                    1.75rem;
            }


            .subtitle {

                font-size:
                    0.72rem;
            }


            .visualizer-container {

                width:
                    140px;

                height:
                    140px;

                margin-bottom:
                    1.2rem;
            }


            .mic-btn {

                width:
                    85px;

                height:
                    85px;
            }


            .mic-icon {

                width:
                    28px;

                height:
                    28px;
            }
        }


        /* =========================================================
           VERY SMALL SCREENS
        ========================================================= */

        @media (max-height: 700px) {

            .container {

                padding-top:
                    1.2rem;

                padding-bottom:
                    1.2rem;
            }


            .header {

                margin-bottom:
                    0.8rem;
            }


            .visualizer-container {

                width:
                    125px;

                height:
                    125px;

                margin-bottom:
                    0.8rem;
            }


            .mic-btn {

                width:
                    78px;

                height:
                    78px;
            }


            .transcript {

                min-height:
                    38px;

                padding:
                    0.55rem;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         CAMERA BACKGROUND
    ========================================================= -->

    <video
        id="cameraBackground"
        autoplay
        playsinline
        muted>
    </video>


    <div class="camera-overlay"></div>

    <div class="camera-glow"></div>


    <!-- =========================================================
         MAIN CARD
    ========================================================= -->

    <main class="container">


        <!-- HEADER -->

        <header class="header">

            <div class="status-indicator">

                <span class="status-dot"></span>

                NEURAL CORE ONLINE

            </div>


            <h1 class="title">

                <span>Nova AI</span>

            </h1>


            <p class="subtitle">

                Next-generation voice agent.
                Speak a command and let Nova handle it.

            </p>

        </header>



        <!-- =====================================================
             VISUALIZER
        ====================================================== -->

        <div class="visualizer-container">

            <div class="ring ring-1"></div>

            <div class="ring ring-2"></div>


            <!-- MIC -->

            <button
                id="micBtn"
                class="mic-btn"
                aria-label="Start voice command">

                <svg
                    class="mic-icon"
                    viewBox="0 0 24 24">

                    <path
                        d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-1.7Z">
                    </path>

                </svg>

            </button>

        </div>



        <!-- =====================================================
             STATUS
        ====================================================== -->

        <div class="status-box">

            <div id="status">

                Click the microphone to speak

            </div>

        </div>



        <!-- =====================================================
             TRANSCRIPT
        ====================================================== -->

        <div
            id="transcript"
            class="transcript">
        </div>



        <!-- =====================================================
             WAVE
        ====================================================== -->

        <div
            id="wave"
            class="wave">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>



        <!-- =====================================================
             EXAMPLE COMMANDS
        ====================================================== -->

        <div class="commands-title">

            Try saying

        </div>


        <div class="commands">


            <button
                class="command-chip"
                data-command="Open YouTube and play Karuppu song">

                🎵 Open YouTube and play Karuppu song

            </button>


            <button
                class="command-chip"
                data-command="Email john at gmail.com type hello">

                ✉ Email john at gmail.com type hello

            </button>


            <button
                class="command-chip"
                data-command="Open Google">

                🌐 Open Google

            </button>


        </div>


    </main>



    <!-- CAMERA ERROR -->

    <div
        id="cameraError"
        class="camera-error">

        Camera access unavailable

    </div>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        /* =========================================================
           ELEMENTS
        ========================================================= */

        const micBtn =
            document.getElementById("micBtn");

        const status =
            document.getElementById("status");

        const transcript =
            document.getElementById("transcript");

        const wave =
            document.getElementById("wave");

        const cameraBackground =
            document.getElementById("cameraBackground");

        const cameraError =
            document.getElementById("cameraError");



        /* =========================================================
           CAMERA
        ========================================================= */

        let cameraStream = null;


        async function startCamera() {

            try {

                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {

                    throw new Error(
                        "Camera API not supported"
                    );
                }


                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: "user",

                            width: {
                                ideal: 1920
                            },

                            height: {
                                ideal: 1080
                            }
                        },

                        audio: false
                    });


                cameraBackground.srcObject =
                    cameraStream;


                cameraBackground.style.display =
                    "block";


                cameraError.classList.remove(
                    "show"
                );

            }

            catch (error) {

                console.error(
                    "Camera error:",
                    error
                );


                cameraBackground.style.display =
                    "none";


                cameraError.classList.add(
                    "show"
                );
            }
        }


        startCamera();



        /* =========================================================
           SPEECH RECOGNITION
        ========================================================= */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition = null;


        if (!SpeechRecognition) {

            status.textContent =
                "Speech recognition is not supported in this browser.";

        }

        else {

            recognition =
                new SpeechRecognition();


            recognition.lang =
                "en-US";


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.maxAlternatives =
                1;



            /* =====================================================
               START LISTENING
            ====================================================== */

            recognition.onstart = function () {

                console.log(
                    "Voice recognition started"
                );


                micBtn.classList.add(
                    "listening"
                );


                wave.classList.add(
                    "active"
                );


                status.textContent =
                    "Listening... Speak your command";


                transcript.textContent =
                    "";
            };



            /* =====================================================
               RESULT
            ====================================================== */

            recognition.onresult =
                async function (event) {

                    const commandText =
                        event.results[0][0].transcript;


                    console.log(
                        "Command:",
                        commandText
                    );


                    transcript.textContent =
                        commandText;


                    status.textContent =
                        "Processing command...";


                    wave.classList.remove(
                        "active"
                    );


                    await sendCommand(
                        commandText
                    );
                };



            /* =====================================================
               ERROR
            ====================================================== */

            recognition.onerror =
                function (event) {

                    console.error(
                        "Speech recognition error:",
                        event.error
                    );


                    micBtn.classList.remove(
                        "listening"
                    );


                    wave.classList.remove(
                        "active"
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        status.textContent =
                            "Microphone permission denied.";

                    }

                    else if (
                        event.error ===
                        "no-speech"
                    ) {

                        status.textContent =
                            "No speech detected. Try again.";

                    }

                    else {

                        status.textContent =
                            "Voice recognition error.";
                    }
                };



            /* =====================================================
               END
            ====================================================== */

            recognition.onend =
                function () {

                    micBtn.classList.remove(
                        "listening"
                    );


                    wave.classList.remove(
                        "active"
                    );


                    if (
                        status.textContent ===
                        "Listening... Speak your command"
                    ) {

                        status.textContent =
                            "Click the microphone to speak";
                    }
                };
        }



        /* =========================================================
           MIC CLICK
        ========================================================= */

        micBtn.addEventListener(
            "click",
            function () {

                if (!recognition) {

                    status.textContent =
                        "Speech recognition is not supported.";

                    return;
                }


                try {

                    if (
                        micBtn.classList.contains(
                            "listening"
                        )
                    ) {

                        recognition.stop();

                    }

                    else {

                        transcript.textContent =
                            "";

                        status.textContent =
                            "Starting microphone...";

                        recognition.start();
                    }

                }

                catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );



        /* =========================================================
           SEND COMMAND TO BACKEND
        ========================================================= */

        async function sendCommand(
            commandText
        ) {

            try {

                const response =
                    await fetch(
                        "/agent",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                command:
                                    commandText
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );
                }


                const data =
                    await response.json();


                console.log(
                    "Agent response:",
                    data
                );


                if (
                    data.success &&
                    data.url
                ) {

                    status.textContent =
                        data.message ||
                        "Command executed successfully.";


                    /*
                     * Small delay makes the UI feel
                     * smoother before opening the page.
                     */

                    setTimeout(
                        function () {

                            window.open(
                                data.url,
                                "_blank"
                            );

                        },
                        600
                    );

                }

                else {

                    status.textContent =
                        data.message ||
                        "Command completed.";

                }

            }

            catch (error) {

                console.error(
                    "Agent error:",
                    error
                );


                status.textContent =
                    "Unable to connect to Nova AI backend.";

            }

        }



        /* =========================================================
           COMMAND CHIPS
        ========================================================= */

        document
            .querySelectorAll(".command-chip")
            .forEach(
                function (chip) {

                    chip.addEventListener(
                        "click",
                        function () {

                            const command =
                                chip.dataset.command;


                            transcript.textContent =
                                command;


                            status.textContent =
                                "Processing example command...";


                            sendCommand(
                                command
                            );
                        }
                    );

                }
            );



        /* =========================================================
           CAMERA CLEANUP
        ========================================================= */

        window.addEventListener(
            "beforeunload",
            function () {

                if (cameraStream) {

                    cameraStream
                        .getTracks()
                        .forEach(
                            function (track) {

                                track.stop();

                            }
                        );
                }

            }
        );

    </script>

</body>

</html>
